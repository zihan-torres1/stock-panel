name: 生成盯盘面板

on:
  schedule:
    # 北京时间（UTC+8）：交易时段每 10 分钟
    - cron: '*/10 1-3 * * 1-5'    # 09:00-11:50
    - cron: '*/10 5-7 * * 1-5'    # 13:00-15:50
    - cron: '20 1 * * 1-5'        # 09:20 盘前补一次
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-panel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成面板
        run: python stock_scout.py --watchlist

      - name: 输出到 docs
        run: |
          mkdir -p docs
          cp "out/今天怎么办.html" docs/index.html
          cp "out/watch.html" docs/watch.html || true
          ls -lh docs/

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "面板更新 $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi
